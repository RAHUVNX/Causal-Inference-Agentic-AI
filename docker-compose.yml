version: '3.8'

services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: causal_user
      POSTGRES_PASSWORD: causal_pass
      POSTGRES_DB: causal_lift_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U causal_user -d causal_lift_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://causal_user:causal_pass@db:5432/causal_lift_db?schema=public
      PORT: '4000'
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Frontend React app
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
